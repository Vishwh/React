name: Deploy Currency Converter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: currency-Convertor/package-lock.json

      - name: Install dependencies
        working-directory: currency-Convertor
        run: npm ci

      - name: Build
        working-directory: currency-Convertor
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: currency-Convertor/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4